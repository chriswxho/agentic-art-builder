[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing-sandbox"
version = "0.1.0"
description = "A small vector drawing assembly and rendering environment"
requires-python = ">=3.10"
dependencies = ["certifi>=2024.7.4", "numpy>=1.24,<3", "Pillow>=10,<13"]

[project.scripts]
drawing-sandbox = "drawing_sandbox.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["drawing_sandbox*"]

[tool.setuptools.package-data]
drawing_sandbox = ["web/*.html", "proto/*.proto"]
